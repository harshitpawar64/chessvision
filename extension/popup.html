<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #161512;
        --panel: #262421;
        --border: #363431;
        --text: #bababa;
        --text-strong: #ffffff;
        --accent: #35c555;
        --accent-hover: #2eb04b;
        --danger: #e5534b;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }

      body {
        width: 320px;
        min-height: 180px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      body.has-board {
        width: 340px;
        height: 600px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 10px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 700;
        color: var(--text-strong);
      }

      .brand img {
        width: 18px;
        height: 18px;
        display: block;
      }

      .btn {
        border: none;
        border-radius: 5px;
        background: var(--accent);
        color: #0d1a10;
        font-weight: 600;
        font-size: 12px;
        padding: 5px 10px;
        cursor: pointer;
        transition: background 0.15s ease;
      }

      .btn:hover {
        background: var(--accent-hover);
      }

      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }

      #status-text {
        padding: 24px 20px;
        text-align: center;
        font-size: 13px;
        line-height: 1.4;
      }

      #status-text.error {
        color: var(--danger);
      }

      body.has-board #status-text {
        display: none;
      }

      #lichess-frame {
        display: none;
        position: absolute;
        top: -55px;
        left: 0;
        width: 100%;
        height: calc(100% + 55px);
        border: none;
      }

      body.has-board #lichess-frame {
        display: block;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="icon.png" alt="chessvision" />
        <span>chessvision</span>
      </div>
      <button id="select-btn" class="btn">Select Board</button>
    </header>

    <main>
      <p id="status-text">Drag a box around any chessboard on the page to analyze it in Lichess.</p>
      <iframe id="lichess-frame" allow="cross-origin-isolated"></iframe>
    </main>

    <script type="module" src="./src/popup.js"></script>
  </body>
</html>
