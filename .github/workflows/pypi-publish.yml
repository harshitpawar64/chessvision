name: Publish to PyPI

on:
  workflow_call:
    inputs:
      tag_name:
        description: "Git tag to checkout and publish"
        required: true
        type: string

jobs:
  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/chessvision/
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag_name }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest-known"

      - name: Build package
        run: uv build

      - name: Publish package to PyPI
        run: uv publish
